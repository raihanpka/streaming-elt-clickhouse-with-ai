spring:
  application:
    name: bromo
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    io.bromo: INFO

bromo:
  contract:
    path: ${BROMO_DATA_CONTRACT:config/data-contract.yml}
  clickhouse:
    url: http://${CLICKHOUSE_HOST:localhost}:${CLICKHOUSE_HTTP_PORT:8123}
  ingest:
    max-event-bytes: ${BROMO_MAX_EVENT_BYTES:65536}
    max-batch-events: ${BROMO_MAX_BATCH_EVENTS:500}
    clickhouse-user: ingest_writer
    clickhouse-password: ${CLICKHOUSE_INGEST_PASSWORD:}
    api-keys: ${BROMO_API_KEY:}
