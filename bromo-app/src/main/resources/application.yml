spring:
  application:
    name: bromo
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  observations:
    annotations:
      enabled: true

# Bromo-specific config. The cassandra and export keys are removed in milestone M1.
bromo:
  kafka:
    topics:
      raw: raw.events.v1
      enriched: enriched.events.v1
      metrics: metrics.hourly.v1
  cassandra:
    keyspace: bromo
  export:
    posthog:
      enabled: false

logging:
  level:
    root: INFO
    io.bromo: DEBUG
