# Bromo local stack. One command: `docker compose -f infra/docker/docker-compose.yml up -d`.
# Local stack (Kafka, Cassandra, PostgreSQL, Redis, optional ScyllaDB and Bromo). Milestone M1 reduces it to
# ClickHouse only. See docs/OPERATIONS.md.

services:

  # Event bus (single node KRaft)
  kafka:
    image: apache/kafka:4.3.0
    container_name: bromo-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - bromo-net

  # Time series store
  cassandra:
    image: cassandra:4.1
    container_name: bromo-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: "bromo"
      CASSANDRA_DC: "datacenter1"
      CASSANDRA_RACK: "rack1"
      CASSANDRA_ENDPOINT_SNITCH: "GossipingPropertyFileSnitch"
      HEAP_NEWSIZE: "128M"
      MAX_HEAP_SIZE: "512M"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT release_version FROM system.local' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s
    volumes:
      - cassandra-data:/var/lib/cassandra
    networks:
      - bromo-net

  # Metadata store (auth, config, alerts)
  postgres:
    image: postgres:18-alpine
    container_name: bromo-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: bromo
      POSTGRES_USER: bromo
      POSTGRES_PASSWORD: bromo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bromo -d bromo || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - bromo-net

  scylladb:
    image: scylladb/scylla:2026.1.5
    container_name: bromo-scylladb
    profiles: ["scylladb"]
    ports:
      - "9042:9042"
    networks:
      - bromo-net

  # Cache (rate limit, JWT blacklist)
  redis:
    image: redis:7-alpine
    container_name: bromo-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data
    networks:
      - bromo-net

  # Bromo application (pre-built image from GHCR)
  bromo:
    image: ghcr.io/raihanpka/bromo:bromo-app-latest
    container_name: bromo-app
    profiles: ["with-app"]   # opt-in: `docker compose --profile with-app up`
    depends_on:
      kafka:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CASSANDRA_CONTACT_POINTS: cassandra:9042
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: bromo
      POSTGRES_USER: bromo
      POSTGRES_PASSWORD: bromo
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    networks:
      - bromo-net

volumes:
  kafka-data:
  cassandra-data:
  postgres-data:
  redis-data:

networks:
  bromo-net:
    driver: bridge
